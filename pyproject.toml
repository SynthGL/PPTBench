[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pptbench"
version = "0.1.0"
description = "Controlled evidence benchmark for presentation editing adapters"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PPTBench maintainers" }]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["python-pptx==1.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
pptbench = "pptbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pptbench"]

[tool.hatch.build]
include = ["src/pptbench/**/*.py", "src/pptbench/data/*.json", "src/pptbench/data/fixtures/*.pptx", "README.md", "LICENSE", "PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
